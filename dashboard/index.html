  function AlertHistoryPanel() {
    const [history, setHistory] = useState([]);
    const [stats, setStats] = useState(null);
    const [loading, setLoading] = useState(false);
    const [filter, setFilter] = useState('all');
    const [expanded, setExpanded] = useState(false);

    const fetchHistory = useCallback(async () => {
      setLoading(true);
      try {
        const severity = filter === 'all' ? null : filter;
        const url = severity ? `/api/alerts/history?limit=100&severity=${severity}` : '/api/alerts/history?limit=100';
        const res = await fetch(url);
        const data = await res.json();
        setHistory(data.alerts || []);
      } catch (e) {
        console.warn('Failed to fetch alert history:', e);
      }
      setLoading(false);
    }, [filter]);

    const fetchStats = useCallback(async () => {
      try {
        const res = await fetch('/api/alerts/stats');
        const data = await res.json();
        setStats(data);
      } catch (e) {
        console.warn('Failed to fetch alert stats:', e);
      }
    }, []);

    useEffect(() => {
      if (expanded) {
        fetchHistory();
        fetchStats();
      }
    }, [expanded, fetchHistory, fetchStats]);

    const formatTime = (ts) => {
      if (!ts) return '—';
      const d = new Date(ts);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    };

    return (
      <Glass className="p-0 overflow-hidden">
        <button
          onClick={() => setExpanded(!expanded)}
          className="w-full px-5 py-4 flex items-center justify-between gap-3 bg-gradient-to-r from-slate-500/10 to-transparent border-b border-white/5 hover:from-slate-500/15 transition-colors"
        >
          <div className="flex items-center gap-3">
            <span className="text-xl">📜</span>
            <div className="text-left">
              <div className="text-sm font-black text-white">Alert History (Audit Log)</div>
              <div className="text-xs text-slate-500">
                {stats ? `${stats.total} total alerts logged • ${stats.by_severity?.critical || 0} critical, ${stats.by_severity?.warning || 0} warnings` : 'Click to load history'}
              </div>
            </div>
          </div>
          <div className="flex items-center gap-3">
            {stats && (
              <div className="flex items-center gap-2">
                <div className="px-2 py-1 rounded-lg bg-rose-500/20 text-rose-400 text-xs font-black">{stats.by_severity?.critical || 0}</div>
                <div className="px-2 py-1 rounded-lg bg-amber-500/20 text-amber-400 text-xs font-black">{stats.by_severity?.warning || 0}</div>
              </div>
            )}
            <svg className={"w-4 h-4 text-slate-500 transition-transform " + (expanded ? "rotate-180" : "")} fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </button>

        {expanded && (
          <div className="p-4 space-y-4">
            {/* Filter Controls */}
            <div className="flex items-center justify-between gap-4 flex-wrap">
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-500 font-black">Filter:</span>
                {['all', 'critical', 'warning'].map(f => (
                  <button
                    key={f}
                    onClick={() => setFilter(f)}
                    className={"px-3 py-1.5 rounded-lg text-xs font-black transition-colors " + (filter === f ? (f === 'critical' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : f === 'warning' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-white/10 text-white border border-white/20') : 'bg-black/20 text-slate-500 border border-white/5 hover:border-white/10')}
                  >
                    {f === 'all' ? 'All' : f.charAt(0).toUpperCase() + f.slice(1)}
                  </button>
                ))}
              </div>
              <button
                onClick={() => { fetchHistory(); fetchStats(); }}
                className="px-3 py-1.5 rounded-lg bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-xs font-black hover:bg-indigo-500/30 transition-colors flex items-center gap-2"
              >
                <svg className={"w-3 h-3 " + (loading ? "animate-spin" : "")} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Refresh
              </button>
            </div>

            {/* Stats Summary */}
            {stats && (
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div className="rounded-xl bg-black/20 border border-white/5 p-3">
                  <div className="text-[10px] uppercase tracking-wider text-slate-500 font-black">Total Logged</div>
                  <div className="mono text-xl font-black text-white mt-1">{stats.total}</div>
                </div>
                <div className="rounded-xl bg-black/20 border border-rose-500/20 p-3">
                  <div className="text-[10px] uppercase tracking-wider text-rose-400/70 font-black">Critical</div>
                  <div className="mono text-xl font-black text-rose-400 mt-1">{stats.by_severity?.critical || 0}</div>
                </div>
                <div className="rounded-xl bg-black/20 border border-amber-500/20 p-3">
                  <div className="text-[10px] uppercase tracking-wider text-amber-400/70 font-black">Warning</div>
                  <div className="mono text-xl font-black text-amber-400 mt-1">{stats.by_severity?.warning || 0}</div>

                <div className="rounded-xl bg-black/20 border border-white/5 p-3">

            {/* Alert List */}
            {loading ? (
              <div className="text-center py-8">
                <div className="w-6 h-6 border-2 border-white/20 border-t-white/60 rounded-full animate-spin mx-auto"></div>

                <div className="text-2xl mb-2">📭</div>
                <div className="text-sm text-slate-500">No alerts logged yet</div>
                <div className="text-xs text-slate-600 mt-1">Critical and warning alerts are automatically logged when activated</div>
              </div>
            ) : (
              <div className="space-y-2 max-h-96 overflow-y-auto pr-2">
                {history.map((a, i) => (
                  <div key={i} className={"rounded-xl bg-black/20 border p-3 " + (a.severity === 'critical' ? 'border-rose-500/20' : a.severity === 'warning' ? 'border-amber-500/20' : 'border-white/5')}>
                    <div className="flex items-start justify-between gap-3">
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-2 flex-wrap">
                          <SeverityBadge severity={a.severity} />
                          <span className="text-sm font-black text-white truncate">{a.title}</span>

                        <div className="text-xs text-slate-500 mt-1">

                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </Glass>
    );

            </div>
            <h2 className="text-xl font-black text-emerald-400 mb-2">All Quiet</h2>
            <p className="text-slate-500 max-w-md mx-auto">
              No persisted anomalies detected across trend, range, stall, and correlation rules.
              Training is proceeding within expected parameters.
            </p>
            <div className="mt-6 flex items-center justify-center gap-4 flex-wrap">
              <div className="px-4 py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
                <span className="text-xs text-emerald-400 font-black">Trends: Stable</span>
              </div>
              <div className="px-4 py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
                <span className="text-xs text-emerald-400 font-black">Ranges: In Band</span>
              </div>
              <div className="px-4 py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20">
                <span className="text-xs text-emerald-400 font-black">Correlations: Clear</span>
              </div>
            </div>
          </Glass>
        )}

        {/* Grouped Alert Sections */}
        {["critical", "warning", "info"].map(severity => {
          const group = groupedAlerts[severity] || [];
          if (group.length === 0) return null;

          const sevStyle = THEME.severity[severity];
          const headerBg = severity === "critical" ? "from-rose-500/15" : severity === "warning" ? "from-amber-500/15" : "from-indigo-500/15";

          return (
            <Glass key={severity} className="overflow-hidden p-0">
              <div className={"px-5 py-4 bg-gradient-to-r " + headerBg + " to-transparent border-b border-white/5"}>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className={"w-3 h-3 rounded-full " + sevStyle.dot}></div>
                    <span className={"text-sm font-black " + (severity === "critical" ? "text-rose-400" : severity === "warning" ? "text-amber-400" : "text-indigo-400")}>
                      {sevStyle.label} Alerts
                    </span>
                    <span className="text-xs text-slate-500">({group.length})</span>
                  </div>
                </div>
              </div>

              <div className="p-4 space-y-3">
                {group.map(a => (
                  <div key={a.id} className={"row " + (severity === "critical" ? "border-rose-500/25" : severity === "warning" ? "border-amber-500/25" : "border-indigo-500/20")}>
                    <div className="flex flex-col gap-3">
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <SeverityBadge severity={a.severity} />
                            <div className="text-sm font-black text-white">{a.title}</div>
                          </div>
                          <div className="text-xs text-slate-500 mt-1">
                            <span className="text-slate-400 font-black">{a.metric}</span>
                            {a.trend ? <span> • {a.trend}</span> : null}
                            {a.currentFmt && a.current != null ? (
                              <span> • now <span className="mono text-slate-200 font-black">{a.currentFmt(a.current)}</span></span>
                            ) : null}
                          </div>
                        </div>
                        <div className={"w-2.5 h-2.5 rounded-full shrink-0 " + sevStyle.dot}></div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div className="rounded-xl bg-black/20 border border-white/5 p-3">
                          <div className="text-[10px] uppercase tracking-wider text-slate-500 font-black flex items-center gap-2">
                            <span>🔍</span> Diagnosis
                          </div>
                          <div className="text-sm text-slate-300 mt-2">{a.diagnosis}</div>
                        </div>
                        <div className="rounded-xl bg-black/20 border border-white/5 p-3">
                          <div className="text-[10px] uppercase tracking-wider text-slate-500 font-black flex items-center gap-2">
                            <span>⚡</span> Suggested Action
                          </div>
                          <div className="text-sm text-slate-300 mt-2">{a.action}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </Glass>
          );
        })}

        {/* Alert History (Audit Log) */}
        <AlertHistoryPanel />

        {/* Alert Configuration Reference */}
        <Glass className="p-4">
          <details>
            <summary className="cursor-pointer text-xs font-black text-slate-500 flex items-center gap-2 hover:text-slate-300 transition-colors">
              <span>⚙️</span> Alert Configuration Reference
            </summary>
            <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="rounded-xl bg-black/20 border border-white/5 p-3">
                <div className="text-[10px] uppercase tracking-wider text-slate-500 font-black mb-2">Slope Thresholds</div>
                <div className="space-y-1 text-xs">
                  <div className="flex justify-between"><span className="text-slate-500">Win Rate ↓</span><span className="mono text-slate-300">warn: {ALERT_CONFIG.slopes.win_rate_down.warning} • crit: {ALERT_CONFIG.slopes.win_rate_down.critical}</span></div>
                  <div className="flex justify-between"><span className="text-slate-500">Drawdown ↑</span><span className="mono text-slate-300">warn: {ALERT_CONFIG.slopes.drawdown_up.warning} • crit: {ALERT_CONFIG.slopes.drawdown_up.critical}</span></div>
                  <div className="flex justify-between"><span className="text-slate-500">KL ↑</span><span className="mono text-slate-300">warn: {ALERT_CONFIG.slopes.kl_up.warning} • crit: {ALERT_CONFIG.slopes.kl_up.critical}</span></div>
                </div>
              </div>
              <div className="rounded-xl bg-black/20 border border-white/5 p-3">
                <div className="text-[10px] uppercase tracking-wider text-slate-500 font-black mb-2">Range Bands</div>
                <div className="space-y-1 text-xs">
                  <div className="flex justify-between"><span className="text-slate-500">Entropy</span><span className="mono text-slate-300">{ALERT_CONFIG.ranges.entropy.min} to {ALERT_CONFIG.ranges.entropy.max}</span></div>
                  <div className="flex justify-between"><span className="text-slate-500">Clip Frac</span><span className="mono text-slate-300">{ALERT_CONFIG.ranges.clip_fraction.min} to {ALERT_CONFIG.ranges.clip_fraction.max}</span></div>
                  <div className="flex justify-between"><span className="text-slate-500">Drawdown</span><span className="mono text-slate-300">warn: {ALERT_CONFIG.ranges.drawdown.max_warning}% • crit: {ALERT_CONFIG.ranges.drawdown.max_critical}%</span></div>
                </div>
              </div>
              <div className="rounded-xl bg-black/20 border border-white/5 p-3">
                <div className="text-[10px] uppercase tracking-wider text-slate-500 font-black mb-2">Stall Detection</div>
                <div className="space-y-1 text-xs">
                  <div className="flex justify-between"><span className="text-slate-500">Reward</span><span className="mono text-slate-300">window: {ALERT_CONFIG.stall.reward.window} • min Δ: {ALERT_CONFIG.stall.reward.min_improvement}</span></div>
                  <div className="flex justify-between"><span className="text-slate-500">Composite</span><span className="mono text-slate-300">window: {ALERT_CONFIG.stall.composite.window} • min Δ: {ALERT_CONFIG.stall.composite.min_improvement}</span></div>
                </div>
              </div>
            </div>
          </details>
        </Glass>
      </div>
    );
  }

  // ─────────────────────────────────────────────────────────────────────────────
  // MAIN APP (alerts, focus, freeze/compare, performance-minded)
  // ─────────────────────────────────────────────────────────────────────────────
  function App() {
    const [data, setData] = useState(null);
    const [connected, setConnected] = useState(false);
    const [activeTab, setActiveTab] = useState("overview");
    const [lastUpdate, setLastUpdate] = useState(null);
    const [updateCount, setUpdateCount] = useState(0);
    const [updateSeq, setUpdateSeq] = useState(0);

    const [focusMode, setFocusMode] = useState(false);
    const [baseline, setBaseline] = useState(null);
    const [compareOn, setCompareOn] = useState(true);

    // local series (client-maintained) for metrics not in backend history (e.g., composite score / readiness)
    const localSeriesRef = useRef({ composite: [], readiness: [] });

    const pushLocal = useCallback((key, val, cap=120) => {
      if (val == null || isNaN(val)) return;
      const arr = localSeriesRef.current[key] || [];
      arr.push(Number(val));
      if (arr.length > cap) arr.splice(0, arr.length - cap);
      localSeriesRef.current[key] = arr;
    }, []);

    useEffect(() => {
      let ws;
      let reconnectTimeout;

      const connect = () => {
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        const url = `${protocol}://${window.location.host}/ws`;
        ws = new WebSocket(url);

        ws.onopen = () => setConnected(true);

        ws.onmessage = (event) => {
          try {
            const payload = JSON.parse(event.data);

            // Update local series (cheap, ref-only)
            const cp = payload?.curriculum_progress || {};
            const cs = cp?.composite_score || null;
            const comp = cs?.total_score != null ? Number(cs.total_score) : null;
            if (comp != null) pushLocal("composite", comp * 100);

            const readiness = (() => {
              if (cs?.total_score != null) return clamp(Number(cs.total_score) * 100, 0, 100);
              const checks = cp?.promotion_checks || {};
              const keys = Object.keys(checks || {});
              const passed = keys.filter(k => checks[k]?.passed).length;
              return keys.length > 0 ? (passed / keys.length) * 100 : null;
            })();
            if (readiness != null) pushLocal("readiness", readiness);

            setData(payload);
            setLastUpdate(new Date());
            setUpdateCount(c => c + 1);
            setUpdateSeq(s => s + 1);
          } catch (e) {
            console.error("Parse error:", e);
          }
        };

        ws.onclose = () => {
          setConnected(false);
          reconnectTimeout = setTimeout(connect, 2000);
        };

        ws.onerror = (err) => console.error("WebSocket error:", err);
      };

      connect();
      return () => {
        if (ws) ws.close();
        if (reconnectTimeout) clearTimeout(reconnectTimeout);
      };
    }, [pushLocal]);

    const derived = useMemo(() => {
      const h = data?.history || {};
      const w = ALERT_CONFIG.window;

      const win = tail(h.win_rates, w);
      const dd  = tail(h.drawdowns, w);
      const rew = tail(h.rewards, w);
      const pnl = tail(h.pnls, w);
      const rm  = tail(h.r_multiples, w);
      const kl  = tail(h.kl_divergence, w);
      const ev  = tail(h.explained_variance, w);

      const slopes = {
        win_rate: regressionSlope(win),
        drawdown: regressionSlope(dd),
        mean_reward: regressionSlope(rew),
        pnl: regressionSlope(pnl),
        r_multiple: regressionSlope(rm),
        kl: regressionSlope(kl),
        ev: regressionSlope(ev),
      };

      const vol = {
        win_rate: stdDev(win),
        drawdown: stdDev(dd),
        mean_reward: stdDev(rew),
        pnl: stdDev(pnl),
        r_multiple: stdDev(rm),
        kl: stdDev(kl),
        ev: stdDev(ev),
      };

      const stallReward = windowedImprovement(h.rewards || [], ALERT_CONFIG.stall.reward.window, ALERT_CONFIG.stall.reward.windows);
      const stallComposite = windowedImprovement(localSeriesRef.current.composite || [], ALERT_CONFIG.stall.composite.window, ALERT_CONFIG.stall.composite.windows);

      const riskEscalation = (slopes.drawdown >= ALERT_CONFIG.correlation.dd_slope_min && slopes.win_rate <= ALERT_CONFIG.correlation.wr_slope_max);

      return {
        slopes,
        vol,
        stall: { reward: stallReward, composite: stallComposite },
        flags: { riskEscalation },
        last: {
          pnl: (Array.isArray(h.pnls) && h.pnls.length) ? h.pnls[h.pnls.length - 1] : null,
          composite: (Array.isArray(localSeriesRef.current.composite) && localSeriesRef.current.composite.length)
            ? localSeriesRef.current.composite[localSeriesRef.current.composite.length - 1]
            : null,
        },
        local_series: {
          readiness: localSeriesRef.current.readiness || [],
          composite: localSeriesRef.current.composite || [],
        },
      };
    }, [data?.timestamp, updateSeq]);

    const { alerts, counts } = useAlerts({ data, derived, updateSeq });

    const tabs = [
      { id: "overview", label: "Overview", icon: "📊" },
      { id: "alerts", label: "Alerts", icon: "🚨", badge: counts.critical + counts.warning },
      { id: "signals", label: "Signals", icon: "🎛️" },
      { id: "stages", label: "Stages", icon: "📈" },
      { id: "curriculum", label: "Curriculum", icon: "🎓" },
      { id: "learning", label: "Learning", icon: "🧠" },
      { id: "charts", label: "Charts", icon: "📉" },
    ];

    const doFreeze = () => {
      // Freeze baseline snapshot (compare anchor). Does not stop live updates.
      if (baseline) {
        setBaseline(null);
      } else if (data && data.status === "active") {
        setBaseline(data);
        setCompareOn(true);
      }
    };

    const alertPills = (
      <div className="flex items-center gap-2">
        <div className={"px-3 py-2 rounded-2xl border border-white/5 flex items-center gap-2 " + (counts.critical > 0 ? THEME.severity.critical.pill : "bg-black/20 text-slate-500")}>
          <div className={"w-2 h-2 rounded-full " + (counts.critical > 0 ? THEME.severity.critical.dot : "bg-slate-500")}></div>
          <span className="text-xs font-black">C</span>
          <span className="mono text-xs font-black">{fmt.int(counts.critical)}</span>
        </div>
        <div className={"px-3 py-2 rounded-2xl border border-white/5 flex items-center gap-2 " + (counts.warning > 0 ? THEME.severity.warning.pill : "bg-black/20 text-slate-500")}>
          <div className={"w-2 h-2 rounded-full " + (counts.warning > 0 ? THEME.severity.warning.dot : "bg-slate-500")}></div>
          <span className="text-xs font-black">W</span>
          <span className="mono text-xs font-black">{fmt.int(counts.warning)}</span>
        </div>
        <div className={"px-3 py-2 rounded-2xl border border-white/5 flex items-center gap-2 " + (counts.info > 0 ? THEME.severity.info.pill : "bg-black/20 text-slate-500")}>
          <div className={"w-2 h-2 rounded-full " + (counts.info > 0 ? THEME.severity.info.dot : "bg-slate-500")}></div>
          <span className="text-xs font-black">I</span>
          <span className="mono text-xs font-black">{fmt.int(counts.info)}</span>
        </div>
      </div>
    );

    return (
      <Page>
        <header className="glass rounded-3xl p-5 mb-4 sticky top-3 z-20">
          <div className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
            <div className="flex items-center gap-4 min-w-0">
              <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/25 animate-glow">
                <span className="text-2xl">🤖</span>
              </div>
              <div className="min-w-0">
                <h1 className="text-xl md:text-2xl font-black gradient-text tracking-tight">
                  PropFirm PPO Dashboard v2.3
                </h1>
                <p className="text-sm text-slate-500 mt-1">
                  Ops Control Room • Alerts • Health Matrix • Freeze/Compare
                </p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <div className="px-3 py-2 rounded-2xl bg-black/20 border border-white/5 flex items-center gap-2">
                <div className={"live-dot " + (connected ? "" : "disconnected")} />
                <span className="text-sm text-slate-300 font-semibold">
                  {connected ? "Live" : "Reconnecting…"}
                </span>
              </div>

              {alertPills}

              <TogglePill active={focusMode} label="Focus" icon="🎯" onClick={() => setFocusMode(v => !v)} />
              <TogglePill active={!!baseline} label={baseline ? "Unfreeze" : "Freeze"} icon="🧊" onClick={doFreeze} />
              <TogglePill active={compareOn && !!baseline} label="Compare Δ" icon="Δ" onClick={() => setCompareOn(v => !v)} />

              {lastUpdate && (
                <div className="px-3 py-2 rounded-2xl bg-black/20 border border-white/5">
                  <span className="text-xs text-slate-500 font-black uppercase tracking-wider">Updated</span>
                  <span className="mono text-sm text-slate-200 font-black ml-2">{lastUpdate.toLocaleTimeString()}</span>
                </div>
              )}

              {data?.progress && (
                <div className="px-3 py-2 rounded-2xl bg-black/20 border border-white/5">
                  <span className="text-xs text-slate-500 font-black uppercase tracking-wider">Steps</span>
                  <span className="mono text-sm text-slate-200 font-black ml-2">
                    {fmt.int(data.progress.timesteps)} / {fmt.int(data.progress.total_timesteps)}
                  </span>
                </div>
              )}
            </div>
          </div>

          <div className="mt-4 flex items-center justify-center">
            <div className="inline-flex items-center gap-1 p-1.5 rounded-2xl bg-black/30 border border-white/5 backdrop-blur-sm flex-wrap justify-center">
              {tabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={"px-5 py-2.5 rounded-xl font-black text-sm transition-all duration-200 flex items-center gap-2 " +
                    (activeTab === tab.id
                      ? "bg-gradient-to-r from-indigo-500/20 via-purple-500/20 to-pink-500/20 text-white border border-indigo-500/30 shadow-lg shadow-indigo-500/10"
                      : "text-slate-400 hover:text-white hover:bg-white/5")}
                >
                  <span className="text-base">{tab.icon}</span>
                  <span>{tab.label}</span>
                  {tab.badge > 0 && (
                    <span className="ml-1 px-1.5 py-0.5 rounded-full text-[10px] font-black bg-rose-500/20 text-rose-300 border border-rose-500/30">
                      {tab.badge}
                    </span>
                  )}
                </button>
              ))}
            </div>
          </div>
        </header>

        <main>
          {!data || data.status === "waiting" ? (
            <Glass className="text-center animate-slide-up">
              <div className="w-20 h-20 mx-auto mb-5 rounded-3xl bg-gradient-to-br from-indigo-500/20 to-pink-500/15 border border-white/10 flex items-center justify-center animate-float">
                <span className="text-4xl">⏳</span>
              </div>
              <h2 className="text-xl font-black text-white mb-2 tracking-tight">Waiting for Training Data</h2>
              <p className="text-slate-500 max-w-md mx-auto">
                {data?.message || "Start training to see live metrics."}
              </p>
              <div className="mt-5 text-xs text-slate-600">
                Listening on <span className="mono text-slate-400">/ws</span>
              </div>
            </Glass>
          ) : (
            <>
              {activeTab === "overview" && (
                <OverviewTab
                  data={data}
                  derived={derived}
                  baseline={baseline}
                  compareOn={compareOn && !!baseline}
                  focusMode={focusMode}
                  alertCounts={counts}
                  onNavigateAlerts={() => setActiveTab("alerts")}
                />
              )}
              {activeTab === "alerts" && (
                <AlertsTab alerts={alerts} counts={counts} derived={derived} data={data} />
              )}
              {activeTab === "signals" && (
                <SignalsTab data={data} />
              )}
              {activeTab === "stages" && (
                <StageProgressTab data={data} />
              )}
              {activeTab === "curriculum" && (
                <CurriculumTab data={data} derived={derived} baseline={baseline} compareOn={compareOn && !!baseline} />
              )}
              {activeTab === "learning" && (
                <LearningTab data={data} baseline={baseline} compareOn={compareOn && !!baseline} />
              )}
              {activeTab === "charts" && <ChartsTab data={data} />}
            </>
          )}
        </main>

        <footer className="mt-6 text-center text-xs text-slate-600">
          <p>PropFirm PPO v2.3 • Updates: <span className="mono">{updateCount}</span></p>
        </footer>
      </Page>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>

</body>
</html>
