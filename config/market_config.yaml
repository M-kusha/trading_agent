category: market
description: Configuration for market modules
modules:
  LiquidityHeatmapLayer:
    config_class: LiquidityConfig
    configuration:
      depth_levels:
        default: '10'
        description: Configuration parameter for depth_levels
        type: int
      dropout_rate:
        default: '0.2'
        description: Configuration parameter for dropout_rate
        type: float
      enable_gpu:
        default: 'True'
        description: Configuration parameter for enable_gpu
        type: bool
      hidden_dim:
        default: '32'
        description: Configuration parameter for hidden_dim
        type: int
      high_liquidity_threshold:
        default: '0.8'
        description: Configuration parameter for high_liquidity_threshold
        type: float
      learning_rate:
        default: '0.001'
        description: Configuration parameter for learning_rate
        type: float
      low_liquidity_threshold:
        default: '0.3'
        description: Configuration parameter for low_liquidity_threshold
        type: float
      lstm_units:
        default: '64'
        description: Configuration parameter for lstm_units
        type: int
      prediction_horizon:
        default: '5'
        description: Configuration parameter for prediction_horizon
        type: int
      sequence_length:
        default: '20'
        description: Configuration parameter for sequence_length
        type: int
      spread_analysis_window:
        default: '50'
        description: Configuration parameter for spread_analysis_window
        type: int
    description: Configuration for LiquidityHeatmapLayer module
  MarketThemeDetector:
    config_class: ThemeDetectorConfig
    configuration:
      batch_size:
        default: '64'
        description: Configuration parameter for batch_size
        type: int
      circuit_breaker_threshold:
        default: '3'
        description: Configuration parameter for circuit_breaker_threshold
        type: int
      clustering_quality_threshold:
        default: '0.3'
        description: Configuration parameter for clustering_quality_threshold
        type: float
      convergence_threshold:
        default: '0.001'
        description: Configuration parameter for convergence_threshold
        type: float
      feature_lookback:
        default: '500'
        description: Configuration parameter for feature_lookback
        type: int
      instruments:
        default: field(default_factory=list)
        description: Configuration parameter for instruments
        type: List[str]
      max_iter:
        default: '100'
        description: Configuration parameter for max_iter
        type: int
      max_processing_time_ms:
        default: '200'
        description: Configuration parameter for max_processing_time_ms
        type: float
      n_themes:
        default: '4'
        description: Configuration parameter for n_themes
        type: int
      window:
        default: '100'
        description: Configuration parameter for window
        type: int
    description: Configuration for MarketThemeDetector module
  RegimePerformanceMatrix:
    config_class: RegimeMatrixConfig
    configuration:
      accuracy_threshold:
        default: '0.6'
        description: Configuration parameter for accuracy_threshold
        type: float
      circuit_breaker_threshold:
        default: '3'
        description: Configuration parameter for circuit_breaker_threshold
        type: int
      decay_factor:
        default: '0.95'
        description: Configuration parameter for decay_factor
        type: float
      max_processing_time_ms:
        default: '150'
        description: Configuration parameter for max_processing_time_ms
        type: float
      n_regimes:
        default: '3'
        description: Configuration parameter for n_regimes
        type: int
      performance_window:
        default: '100'
        description: Configuration parameter for performance_window
        type: int
      regime_sensitivity:
        default: '1.0'
        description: Configuration parameter for regime_sensitivity
        type: float
      vol_history_size:
        default: '500'
        description: Configuration parameter for vol_history_size
        type: int
    description: Configuration for RegimePerformanceMatrix module
  TimeAwareRiskScaling:
    config_class: TimeAwareRiskConfig
    configuration:
      asian_end:
        default: '8'
        description: Configuration parameter for asian_end
        type: int
      asian_multiplier:
        default: '1.2'
        description: Configuration parameter for asian_multiplier
        type: float
      base_factor:
        default: '1.0'
        description: Configuration parameter for base_factor
        type: float
      circuit_breaker_threshold:
        default: '3'
        description: Configuration parameter for circuit_breaker_threshold
        type: int
      closed_multiplier:
        default: '0.5'
        description: Configuration parameter for closed_multiplier
        type: float
      decay_factor:
        default: '0.9'
        description: Configuration parameter for decay_factor
        type: float
      euro_end:
        default: '16'
        description: Configuration parameter for euro_end
        type: int
      european_multiplier:
        default: '1.0'
        description: Configuration parameter for european_multiplier
        type: float
      max_processing_time_ms:
        default: '100'
        description: Configuration parameter for max_processing_time_ms
        type: float
      risk_threshold_critical:
        default: '0.95'
        description: Configuration parameter for risk_threshold_critical
        type: float
      risk_threshold_high:
        default: '0.8'
        description: Configuration parameter for risk_threshold_high
        type: float
      session_memory:
        default: '24'
        description: Configuration parameter for session_memory
        type: int
      us_end:
        default: '22'
        description: Configuration parameter for us_end
        type: int
      us_multiplier:
        default: '1.1'
        description: Configuration parameter for us_multiplier
        type: float
      vol_window:
        default: '100'
        description: Configuration parameter for vol_window
        type: int
    description: Configuration for TimeAwareRiskScaling module
