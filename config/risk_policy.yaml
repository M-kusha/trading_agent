# -------------------------------------------------------------
# Risk Policy Configuration
# Used by risk modules (DynamicRiskController, PortfolioRiskSystem,
# SmartPositionManager, etc.)
# -------------------------------------------------------------

# ═══════════════════════════════════════════════════════════════
# PROP FIRM CONFIGURATION
# System-level understanding of prop rules (FTMO-style)
# ═══════════════════════════════════════════════════════════════
prop_firm:
  enabled: true                      # Enable prop-firm mode
  firm_name: "FTMO"                  # For logging/reference

  # CRITICAL: Drawdown limits (% of starting balance / equity base)
  daily_drawdown_limit: 0.05         # 5% daily loss = challenge failed
  max_drawdown_limit: 0.10           # 10% total loss = challenge failed

  # Trailing drawdown (some firms use this)
  trailing_drawdown: false           # FTMO=false, E8/TFT may use true
  trailing_locks_at_breakeven: true  # Does trailing lock when you reach breakeven?

  # Profit target (for evaluation phases)
  profit_target: 0.10                # 10% profit target

  # Trading rules
  allow_weekend_holding: false       # Close positions before weekend
  min_trading_days: 4                # Minimum days required
  max_daily_profit_pct: 0.40         # No single day > 40% of target

  # Safety buffers (stop BEFORE hitting actual limit)
  # CRITICAL: Account closes at EXACTLY 10% - we must NEVER reach it!
  daily_dd_safety_buffer: 0.008      # Stop trading at 4.2% daily (5% - 0.8%)
  max_dd_safety_buffer: 0.015        # Stop NEW trades at 8.5% (10% - 1.5%)

  # ADDITIONAL SAFETY: Close ALL positions at 9% to protect the €1,000 buffer
  emergency_close_all_threshold: 0.09  # Close ALL at 9% (€1,000 safety margin)

  # Account details
  account_size: 100000.0             # €100,000 challenge account
  phase: "evaluation"                # "evaluation", "verification", "funded"


# ═══════════════════════════════════════════════════════════════
# TRADE LIMITS - CENTRALIZED CONFIGURATION
# Single source of truth for max trades per day / session
# Used by: Executor, PPOObservationBuilder, ArbiterLogic, CurriculumPlannerPlus
# ═══════════════════════════════════════════════════════════════
trade_limits:
  # Maximum trades per day (across all instruments)
  max_trades_per_day: 20             # Default: 20 trades/day
  
  # Per-stage curriculum overrides (used by CurriculumPlannerPlus)
  # These are multipliers/overrides for different learning stages
  curriculum_stage_limits:
    Foundation: 15                   # Conservative during learning
    Development: 20                  # Slightly more freedom
    Intermediate: 12                 # Focus on quality over quantity
    Advanced: 15                     # Balance
    Expert: 20                       # Full autonomy
  
  # Training mode override (effectively unlimited in training)
  training_mode_limit: 9999          # Don't restrict during training


# ═══════════════════════════════════════════════════════════════
# UNIFIED LOT SIZING - PROP FIRM OPTIMIZED
# Used by modules.utils.lot_calculator.UnifiedLotCalculator
# ═══════════════════════════════════════════════════════════════
lot_sizing:
  # Account parameters
  account_balance: 100000.0          # €100,000 account (should match prop_firm.account_size)
  account_leverage: 100.0            # 100:1 leverage
  account_currency: "EUR"

  # Risk parameters - CONSERVATIVE for prop firms
  risk_per_trade_pct: 0.003          # 0.3% risk per trade (~€300 at €100k)
  max_risk_per_trade_pct: 0.007      # Hard cap: 0.7% max (~€700)

  # With 0.3% risk and 5% daily limit, you can have:
  # - ~14 consecutive full losers before daily limit (~4.2%)
  # - ~33 consecutive full losers before 10% max drawdown

  # Lot constraints
  min_lot: 0.01                      # Broker minimum
  max_lot: 10.0                      # Reduced max for prop firm safety
  lot_step: 0.01                     # Lot increment precision

  # Position limits - STRICT for prop firms
  max_positions: 2                   # Max 2 concurrent (diversify but don't overexpose)

  # Global exposure cap (fraction of equity allowed as margin usage)
  max_exposure_pct: 0.15             # Max 15% margin per position

  # Dynamic scaling toggles
  volatility_scaling: true           # Scale lots by volatility
  drawdown_scaling: true             # Reduce lots during drawdown
  signal_strength_scaling: true      # Scale by signal confidence


# ═══════════════════════════════════════════════════════════════
# Global Risk Controls
# ═══════════════════════════════════════════════════════════════
controls:
  stop_loss_enabled: true
  take_profit_enabled: true
  trailing_stop_enabled: false
  circuit_breaker_enabled: true
  position_monitoring_enabled: true


# ═══════════════════════════════════════════════════════════════
# POSITION MANAGER EMERGENCY THRESHOLDS - PROP FIRM TUNED
# Used by modules/position/* and risk controllers
# ═══════════════════════════════════════════════════════════════
position_manager:
  # Reality: prop firms care about realized P&L, not notional exposure.
  # Exposure-based emergencies are mostly irrelevant for challenge rules.
  enable_exposure_emergency: false   # Disabled – firms don't care about notional
  emergency_exposure_trigger: 1.0    # 100% = effectively never triggers

  # Emergency drawdown trigger – WELL BELOW daily limit
  emergency_drawdown_trigger: 0.035  # 3.5% drawdown = emergency (daily limit is 5%)

  # Max consecutive losses before emergency regime
  max_consecutive_losses: 3          # Can't afford long loss streaks

  # Max concentration per instrument (fraction of risk)
  max_instrument_concentration: 0.50 # Allow concentration in best setups


# ═══════════════════════════════════════════════════════════════
# SMART POSITION MANAGEMENT - PROP FIRM TUNED
# Used by SmartPositionManager (live) + PositionManager (training alignment)
# ═══════════════════════════════════════════════════════════════
smart_position:
  # Position limits
  max_positions_per_symbol: 1        # ONE net position per symbol
  max_total_positions: 2             # Max 2 positions total (prop firm safe)

  # Lot sizing - fallbacks only, UnifiedLotCalculator is single source of truth
  default_lot_size: 0.01
  max_lot_size: 10.0
  use_unified_calculator: true

  # Optional: partial scale-down on losers (handled by SmartPositionManager)
  # For now we keep this OFF so losers are handled primarily by ExitEngine + SL.
  enable_smart_scale_down: false     # You can set true later if you want partial cuts

  # ═══════════════════════════════════════════════════════════════
  # SCALE-UP CONFIGURATION
  # NOTE: MT5 hedging accounts create a NEW ticket for each scale-up order.
  # SmartPositionManager automatically nets multiple tickets into 1 logical position.
  # When closing, ALL tickets for the symbol are closed together.
  # ═══════════════════════════════════════════════════════════════
  enable_scale_up: true              # Allow scaling up winning positions

  # Scaling rules (EUR-based fallback when R-based disabled) - ONLY USED IF enable_scale_up: true
  scale_up_min_profit_eur: 50.0
  scale_up_cooldown_seconds: 600.0
  scale_down_trigger_loss_eur: 40.0

  # Breakeven SL activation - move SL to entry when profit reaches this threshold
  # Should match trailing_activation_eur in exit_strategies for consistency
  breakeven_activation_eur: 150.0

  # Trade cooldowns
  same_direction_cooldown_seconds: 300.0
  reversal_cooldown_seconds: 300.0

  # Signal thresholds - kept relatively low, upstream experts already filter
  min_signal_strength: 0.45
  strong_signal_threshold: 0.65
  reversal_signal_threshold: 0.60

  # ═════════════════════════════════════════════════════════════
  # R-BASED SCALING (REWARD-TO-RISK) - PROFESSIONAL RISK MGMT
  # R = current_pnl / initial_risk_eur
  # ═════════════════════════════════════════════════════════════
  use_r_based_scaling: true          # Enable R-based scaling (recommended)
  scale_up_min_r: 1.0                # Scale up after 1R profit (~€300)
  scale_down_trigger_r: -0.5         # Start scale down at 0.5R loss (~€150)
  scale_down_aggressive_r: -1.0      # Aggressive scale down at 1R loss
  scale_down_emergency_r: -1.5       # Emergency scale down at 1.5R (before hard stop)

  # ═════════════════════════════════════════════════════════════
  # POSITION LIFECYCLE THRESHOLDS (time-aware but intraday)
  # PROBE → BUILD → RIDE → DEFEND → EXIT
  # ═════════════════════════════════════════════════════════════
  lifecycle:
    # Scaled for intraday / short holding, not multi-hour swing trading
    probe_max_age_hours: 0.33        # First ~20 min = PROBE (tightest management)
    probe_max_profit_r: 0.3          # Exit PROBE if gains 0.3R profit
    build_max_age_hours: 1.0         # Up to ~1 hour = BUILD (let it develop)
    build_max_profit_r: 1.0          # Exit BUILD if gains 1R profit
    ride_min_profit_r: 0.5           # Need 0.5R profit to enter RIDE
    # DEFEND triggers BEFORE trailing close (20% < 30%) so it has time to act
    defend_trigger_drawdown_pct: 0.20 # If profit drops 20% from peak, enter DEFEND

  # ═════════════════════════════════════════════════════════════
  # DRAWDOWN-AWARE AGGRESSION CONTROL
  # Automatically become more defensive during drawdowns
  # ═════════════════════════════════════════════════════════════
  drawdown_aggression:
    enabled: true
    mild_dd_threshold: 0.015         # 1.5% DD = mild caution
    moderate_dd_threshold: 0.025     # 2.5% DD = moderate caution
    severe_dd_threshold: 0.035       # 3.5% DD = defensive mode
    mild_aggression_mult: 0.85       # Reduce aggression by 15%
    moderate_aggression_mult: 0.65   # Reduce aggression by 35%
    severe_aggression_mult: 0.40     # Reduce aggression by 60%

  # ═════════════════════════════════════════════════════════════
  # PER-INSTRUMENT CONFIGURATION
  # Override global defaults for specific instruments
  # ═════════════════════════════════════════════════════════════
  per_instrument:
    EURUSD:
      # EUR/USD is calmer – slightly tighter thresholds
      scale_up_min_profit_eur: 40.0
      scale_down_trigger_loss_eur: 35.0
      min_signal_strength: 0.42
      strong_signal_threshold: 0.60

      # R-based overrides: can scale earlier on EURUSD
      scale_up_min_r: 0.8            # Scale earlier on EURUSD
      scale_down_trigger_r: -0.4     # Tighter scale-down threshold

      # Startup grace (number of decide() calls before trusting signals)
      startup_grace_calls: 3

      # Lifecycle tweaks
      probe_max_age_hours: 0.5       # Slightly longer probe for slower EUR

    XAUUSD:
      # Gold is more volatile – wider thresholds
      scale_up_min_profit_eur: 70.0
      scale_down_trigger_loss_eur: 50.0
      min_signal_strength: 0.50
      strong_signal_threshold: 0.70

      # R-based overrides: need more proof before pressing
      scale_up_min_r: 1.2            # Need more profit to scale gold
      scale_down_trigger_r: -0.6     # Allow wider swings in R

      # Startup grace – more signals before trusting
      startup_grace_calls: 5

      # Lifecycle tweaks
      probe_max_age_hours: 0.25      # Short probe for very fast gold moves


# ═══════════════════════════════════════════════════════════════
# EMERGENCY WATCHDOG - BACKGROUND SAFETY NET (Independent Thread)
# Runs independently of main orchestrator loop to catch missed exits.
# This is a LAST RESORT - native MT5 SL is always faster!
# ═══════════════════════════════════════════════════════════════
watchdog:
  enabled: true                      # Enable background watchdog
  check_interval_s: 2.0              # Check every 2 seconds
  verbose: false                     # Set true for debug logging

  # Per-position thresholds (should loosely align with ExitEngine)
  hard_stop_eur: 220.0               # Mirror exit_strategies.hard_stop_loss_eur
  emergency_stop_eur: 350.0          # ~1.5x hard stop (true failsafe)
  emergency_multiplier: 1.5          # Used if emergency_stop_eur not set

  # Daily account protection (5% daily limit)
  daily_loss_limit_eur: 4200.0       # €4,200 = 4.2% of €100k

  # MAX DRAWDOWN PROTECTION (10% = account closed!)
  # Close ALL positions at 9% to protect €1,000 buffer
  max_loss_limit_eur: 9000.0         # €9,000 = 9% of €100k = CLOSE ALL


# ═══════════════════════════════════════════════════════════════
# EXIT STRATEGIES - SINGLE SOURCE OF TRUTH FOR EXITS
# Used by modules/position/exit_engine.py (ExitStrategyEngine)
# ═══════════════════════════════════════════════════════════════
exit_strategies:
  # HARD STOP – absolute per-position loss (EUR)
  # With 0.3% risk (~€300), this kills at ~70–75% of that.
  hard_stop_loss_eur: 220.0

  # SOFT STOP – loss + strong opposing signal
  soft_stop_loss_eur: 140.0
  soft_stop_min_signal: 0.35        # Need some real conviction against us

  # TIME DECAY – position too old + losing / stale profit
  # NOTE: In training/simulation, time passes fast (1 step = 15min candle)
  # 4 hours = 16 M15 bars → gives positions time to develop
  time_decay_hours: 4.0             # After ~4h it's considered "old"
  time_decay_stop_eur: 60.0         # Old AND losing more than 60 => cut

  # TRAILING PROFIT – dynamic trailing around peak (ATR-aware)
  trailing_activation_eur: 100.0    # Start trailing after +100 EUR
  trailing_activation_atr: 2.0      # Or ~2x ATR in EUR
  trailing_retrace_pct: 0.30        # Allow ~30% giveback from peak
  trailing_retrace_atr: 1.5         # Or ~1.5x ATR retrace
  trailing_use_atr: true
  trailing_min_peak_eur: 50.0       # Ignore tiny peaks

  # MOMENTUM EXIT – strong reversal while profitable
  momentum_exit_profit_eur: 120.0
  momentum_reversal_signal: 0.65    # Strong reversal threshold

  # SIGNAL EXIT – agent loses conviction / flips direction
  # NOTE: This exit is DISABLED during training (training mode bypasses signal exits)
  # so the agent learns consequences of direction flips through reward signals.
  # Only active in live/production where capital protection matters.
  signal_exit_threshold: 0.05       # Below 0.05 = "no conviction", exit
  signal_direction_weight: 0.80     # Opposite direction with ≥0.80 strength => exit

  # Regime scaling – volatility-aware tightening/loosening
  volatile_regime_tighten: 0.7      # Tighter in volatile regime (<1.0)
  ranging_regime_loosen: 1.2        # Looser in ranging regime (>1.0)
  trending_regime_neutral: 1.0      # Neutral in trending/normal

  # EMERGENCY – account-level protection
  # daily_loss_limit_eur is expected to be the *buffered* daily limit (e.g. 4.2%).
  emergency_drawdown_pct: 0.085          # 8.5% equity drawdown (matches limits.max_drawdown)
  emergency_daily_loss_buffer_pct: 0.84  # 84% of firm 5% => ~4.2% if limit is 5%
  emergency_max_open_risk_eur: 2000.0    # Failsafe on total open risk

  # Per-instrument exit overrides (merged over globals)
  per_instrument:
    XAUUSD:
      hard_stop_loss_eur: 220
      trailing_activation_eur: 120
      trailing_retrace_pct: 0.22
    EURUSD:
      trailing_use_atr: true
      trailing_retrace_pct: 0.25


# ═══════════════════════════════════════════════════════════════
# Stop Loss / Take Profit Settings (in pips)
# EMERGENCY safety net ONLY - wider than ExitEngine thresholds!
# Real exit logic is handled by SmartPositionManager/ExitEngine.
# Native SL should only trigger if ExitEngine fails.
# ═══════════════════════════════════════════════════════════════
sl_tp_settings:
  # ═════════════════════════════════════════════════════════════
  # ADAPTIVE ATR-BASED SL/TP (Preferred - volatility-aware)
  # When enabled, SL/TP are calculated from real-time ATR data.
  # Falls back to fixed pips if ATR unavailable.
  # ═════════════════════════════════════════════════════════════
  use_adaptive_sl_tp: true           # Enable ATR-based adaptive SL/TP
  adaptive_sl_atr_multiplier: 2.5    # SL = 2.5x ATR (emergency backup)
  adaptive_tp_atr_multiplier: 4.0    # TP = 4x ATR (if auto_tp_enabled)

  # ═════════════════════════════════════════════════════════════
  # FIXED PIP FALLBACK VALUES (Used when ATR unavailable)
  # Default values per instrument (in pips)
  # ═════════════════════════════════════════════════════════════
  EURUSD:
    stop_loss_pips: 200      # 200 pips SL - WIDER than ExitEngine (emergency only)
    take_profit_pips: 0      # Let ExitEngine handle TP

  XAUUSD:
    # Native SL should be WIDER than ExitEngine hard stop as emergency backup.
    stop_loss_pips: 2500     # Gold SL: ~$25 move (emergency ONLY)
    take_profit_pips: 0      # Let ExitEngine handle exits via trailing

  # Default fallback for any other symbol
  default:
    stop_loss_pips: 200      # Wide emergency SL
    take_profit_pips: 0      # Let ExitEngine handle TP

  # Enable automatic SL/TP on new orders
  auto_sl_enabled: true      # ALWAYS have an emergency SL
  auto_tp_enabled: false     # DISABLE native TP - ExitEngine handles this
  fix_missing_sl_tp: true    # Repair orders with missing SL/TP


# ═══════════════════════════════════════════════════════════════
# Risk Escalation Thresholds - PROP FIRM TUNED
# Trigger warnings / shutdown BEFORE firm rules are breached
# ═══════════════════════════════════════════════════════════════
escalation:
  alert_threshold: 0.015      # 1.5% loss = alert
  warning_threshold: 0.025    # 2.5% loss = warning
  shutdown_threshold: 0.035   # 3.5% loss = stop opening new trades
  emergency_threshold: 0.042  # 4.2% loss = emergency close-all (below 5% daily)


# ═══════════════════════════════════════════════════════════════
# Portfolio Risk Limits - PROP FIRM STRICT
# CRITICAL: 10% max drawdown = account CLOSED. Must stay under!
# ═══════════════════════════════════════════════════════════════
limits:
  max_daily_loss: 0.042       # Stop at 4.2% (buffer below 5% firm limit)
  max_drawdown: 0.085         # Stop NEW trades at 8.5% (~€1,500 buffer)
  emergency_max_drawdown: 0.09  # Close ALL at 9% (protect €1,000 buffer)

  # Position size limits (fraction of balance as notional)
  max_position_size: 0.15     # Max 15% of balance per position
  max_exposure_pct: 0.30      # Max 30% total exposure across all positions

  max_portfolio_var: 0.015    # Max 1.5% daily VaR
  max_leverage: 100.0         # Match broker leverage
  max_correlation: 0.70       # Avoid too-correlated positions


# ═══════════════════════════════════════════════════════════════
# Risk Module Specific Overrides
# Hook points for other risk modules in your system
# ═══════════════════════════════════════════════════════════════
modules:
  DynamicRiskController:
    base_risk_scale: 1.0
    emergency_scaling: 0.3
    recovery_multiplier: 1.2

  PortfolioRiskSystem:
    var_confidence: 0.95
    correlation_window: 30
    rebalance_frequency: "daily"

  DrawdownRescue:
    activation_threshold: 0.10
    max_rescue_duration: 3600
    recovery_target: 0.05

  AnomalyDetector:
    # PnL spike thresholds
    pnl_limit: 1000.0                # Flag PnL changes > €1000
    volume_zscore: 3.0               # Flag volume > 3 std devs
    price_zscore: 3.0                # Flag price moves > 3 std devs
    observation_zscore: 4.0          # Flag observation anomalies > 4 std devs
    # History
    history_size: 100
    learning_rate: 0.05
    # Performance
    max_processing_time_ms: 50.0


# ═══════════════════════════════════════════════════════════════
# SESSION MANAGEMENT - CANONICAL SOURCE
# ═══════════════════════════════════════════════════════════════
# ALL trading time configuration lives here. Do NOT duplicate elsewhere.
# Referenced by:
#   - system_config.yaml → SeasonalityRiskExpert (inherits from here)
#   - timing_policy.yaml → (references these values, no duplication)
#   - modules/timing/timing_features.py → load_timing_config()
#   - modules/strategy/entry_timing_controller.py
#   - LotCalculator, SmartPositionManager, ArbiterLogic
# ═══════════════════════════════════════════════════════════════
session_management:
  # ─────────────────────────────────────────────────────────────
  # TRADING TIMEZONE
  # ─────────────────────────────────────────────────────────────
  timezone: "Europe/Berlin"   # All hours below are in this timezone

  # ═════════════════════════════════════════════════════════════
  # PRIME HOURS - Best trading windows (local time)
  # During prime hours: boost signal confidence & lot size
  # ═════════════════════════════════════════════════════════════
  prime_hours_start: 14              # 14:00 local (EU/US overlap start)
  prime_hours_end: 17                # 17:00 local (peak liquidity)
  prime_hours_confidence_boost: 0.15 # +15% confidence boost in prime hours
  prime_hours_lot_multiplier: 1.25   # +25% lot size in prime hours

  # ═════════════════════════════════════════════════════════════
  # FINAL EXIT WINDOW - Obligatory overnight avoidance
  # Last N minutes before hard_close_hour forces position review
  # ═════════════════════════════════════════════════════════════
  hard_close_hour: 22                # 22:00 local = hard close deadline
  final_exit_window_minutes: 60      # Last 60 min before hard close
  final_exit_obligatory: true        # Make final exit window obligatory
  final_exit_max_loss_pct: 0.02      # Max 2% loss to force exit (protect from big gap)

  # ═════════════════════════════════════════════════════════════
  # NO NEW TRADES WINDOW (must match system_config.yaml)
  # Block new trades in certain hours (overnight, low liquidity)
  # ═════════════════════════════════════════════════════════════
  no_new_trades_start: 18            # 18:00 local = stop new trades (matches local_trade_end_hour)
  no_new_trades_end: 9               # 09:00 local = resume new trades (matches local_trade_start_hour)
  allow_close_during_block: true     # Always allow CLOSE/TIGHTEN when blocked
  allow_defend_during_block: true    # Allow defensive actions when blocked


# ═══════════════════════════════════════════════════════════════
# Risk Assessment Parameters (offline analytics / dashboards)
# ═══════════════════════════════════════════════════════════════
assessment:
  lookback_period_days: 30
  confidence_interval: 0.95
  stress_test_scenarios:
    - "market_crash"
    - "liquidity_crisis"
    - "volatility_spike"
  monte_carlo_simulations: 1000
