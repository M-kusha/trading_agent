# Risk Policy Configuration
# Used by risk category modules (DynamicRiskController, PortfolioRiskSystem, etc.)

# Global Risk Controls
controls:
  stop_loss_enabled: true
  take_profit_enabled: true
  trailing_stop_enabled: false
  circuit_breaker_enabled: true
  position_monitoring_enabled: true

# ═══════════════════════════════════════════════════════════════
# SMART POSITION MANAGEMENT
# Professional net position system with intelligent exits
# ═══════════════════════════════════════════════════════════════
smart_position:
  # Position limits
  max_positions_per_symbol: 1      # ONE position per symbol (no stacking)
  max_total_positions: 4           # Max across all symbols
  default_lot_size: 0.2
  max_lot_size: 1.0
  
  # Profit-taking thresholds (EUR)
  profit_take_activation_eur: 30.0   # Start trailing after €30 profit
  profit_take_trail_pct: 0.25        # Close if drops 25% from peak
  momentum_exit_profit_eur: 15.0     # Take profit on signal reversal
  
  # Loss-cutting thresholds (EUR)
  hard_stop_loss_eur: 100.0          # Absolute max loss (always exit)
  soft_stop_loss_eur: 30.0           # Cut early if signal against
  time_decay_stop_eur: 50.0          # Cut if losing AND position old
  time_decay_hours: 4.0              # Position age threshold
  
  # Scaling rules
  scale_up_min_profit_eur: 10.0      # Only add if in profit
  scale_up_cooldown_seconds: 300.0   # 5 min between scale-ups
  scale_down_trigger_loss_eur: 20.0  # Scale down if losing
  
  # Trade cooldowns
  same_direction_cooldown_seconds: 300.0  # 5 min between same-direction
  reversal_cooldown_seconds: 120.0        # 2 min after reversal
  
  # Signal thresholds
  min_signal_strength: 0.3
  strong_signal_threshold: 0.6
  reversal_signal_threshold: 0.5

# Stop Loss / Take Profit Settings (in pips)
# These are critical for protecting positions if network disconnects
sl_tp_settings:
  # Default values per instrument (in pips)
  EURUSD:
    stop_loss_pips: 50      # 50 pips SL
    take_profit_pips: 100   # 100 pips TP (2:1 reward/risk)
  XAUUSD:
    stop_loss_pips: 200     # $2.00 for gold (200 points = $2)
    take_profit_pips: 400   # $4.00 for gold (2:1 reward/risk)
  # Default fallback for any other symbol
  default:
    stop_loss_pips: 50
    take_profit_pips: 100
  # Enable/disable automatic SL/TP on new orders
  auto_sl_enabled: true
  auto_tp_enabled: true
  # Modify existing positions without SL/TP
  fix_missing_sl_tp: true

# Risk Escalation Thresholds
escalation:
  alert_threshold: 0.03
  warning_threshold: 0.04
  shutdown_threshold: 0.05
  emergency_threshold: 0.08

# Portfolio Risk Limits
limits:
  max_daily_loss: 0.02
  max_drawdown: 0.05
  max_position_size: 0.1
  max_portfolio_var: 0.025
  max_leverage: 10.0
  max_correlation: 0.8

# Risk Module Specific Overrides
modules:
  DynamicRiskController:
    base_risk_scale: 1.0
    emergency_scaling: 0.3
    recovery_multiplier: 1.2

  PortfolioRiskSystem:
    var_confidence: 0.95
    correlation_window: 30
    rebalance_frequency: 'daily'

  DrawdownRescue:
    activation_threshold: 0.10
    max_rescue_duration: 3600
    recovery_target: 0.05

# Risk Assessment Parameters
assessment:
  lookback_period_days: 30
  confidence_interval: 0.95
  stress_test_scenarios: ['market_crash', 'liquidity_crisis', 'volatility_spike']
  monte_carlo_simulations: 1000
