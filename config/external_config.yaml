category: external
description: Configuration for external modules
modules:
  MarketDataProvider:
    config_class: MarketDataConfig
    configuration:
      buffer_size:
        default: '10000'
        description: Configuration parameter for buffer_size
        type: int
      data_directory:
        default: '''data/processed'''
        description: Configuration parameter for data_directory
        type: str
      enable_error_pinpointing:
        default: 'True'
        description: Configuration parameter for enable_error_pinpointing
        type: bool
      enable_health_monitoring:
        default: 'True'
        description: Configuration parameter for enable_health_monitoring
        type: bool
      enable_performance_tracking:
        default: 'True'
        description: Configuration parameter for enable_performance_tracking
        type: bool
      enable_technical_indicators:
        default: 'True'
        description: Configuration parameter for enable_technical_indicators
        type: bool
      primary_timeframe:
        default: '''H4'''
        description: Configuration parameter for primary_timeframe
        type: str
      supported_symbols:
        default: 'field(default_factory=lambda: [''XAUUSD'', ''EURUSD''])'
        description: Configuration parameter for supported_symbols
        type: List[str]
      supported_timeframes:
        default: 'field(default_factory=lambda: [''H1'', ''H4'', ''D1''])'
        description: Configuration parameter for supported_timeframes
        type: List[str]
      update_frequency:
        default: '1.0'
        description: Configuration parameter for update_frequency
        type: float
    description: Configuration for MarketDataProvider module
  NewsSentimentModule:
    config_class: SentimentConfig
    configuration:
      cache_ttl:
        default: '60'
        description: Configuration parameter for cache_ttl
        type: int
      circuit_breaker_threshold:
        default: '3'
        description: Configuration parameter for circuit_breaker_threshold
        type: int
      default_sentiment:
        default: '0.0'
        description: Configuration parameter for default_sentiment
        type: float
      enabled:
        default: 'False'
        description: Configuration parameter for enabled
        type: bool
      max_processing_time_ms:
        default: '300'
        description: Configuration parameter for max_processing_time_ms
        type: float
      max_retries:
        default: '2'
        description: Configuration parameter for max_retries
        type: int
      min_confidence:
        default: '0.3'
        description: Configuration parameter for min_confidence
        type: float
      timeout:
        default: '10.0'
        description: Configuration parameter for timeout
        type: float
    description: Configuration for NewsSentimentModule module
  SessionManager:
    config_class: SessionConfig
    configuration:
      enable_error_pinpointing:
        default: 'True'
        description: Configuration parameter for enable_error_pinpointing
        type: bool
      enable_health_monitoring:
        default: 'True'
        description: Configuration parameter for enable_health_monitoring
        type: bool
      enable_performance_tracking:
        default: 'True'
        description: Configuration parameter for enable_performance_tracking
        type: bool
      performance_window:
        default: '100'
        description: Configuration parameter for performance_window
        type: int
      session_duration:
        default: '3600'
        description: Configuration parameter for session_duration
        type: int
    description: Configuration for SessionManager module
