execution:
  max_workers: 4
  retry_attempts: 5

  # Provider stability
  provider_switch_delay_ms: 1000
  provider_stability_threshold: 5

  # Orchestrator timeouts
  timeouts:
    # Fallback when no per-module/per-category override matches
    default_ms: 500

    # Strong, explicit per-module overrides (win over category/default)
    by_module:
      # Market analysis (heavy)
      UnifiedMarketModule: 15000  # init + 54k bars
      PositionManager: 20000  # Increased - handles signal extraction and position logic

      # Voting / coordination (new modular voting system)
      ThemeExpert: 3000
      SeasonalityRiskExpert: 3000
      MomentumExpert: 3000
      TrendExpert: 3000
      CommitteeCoordinator: 5000
      ConsensusAnalyzer: 3000
      CollusionDetector: 3000
      HorizonAligner: 3000
      UncertaintySampler: 3000
      FinalArbiter: 4000
      SlimVotingKernel: 8000
      # Legacy voting names (kept for backward compat)
      AlternativeRealitySampler: 6000
      DynamicRiskController: 10000  # Increased - complex risk calculations
      TimeHorizonAligner: 6000
      CollusionAuditor: 6000
      EnhancedVotingCommitteeCoordinator: 8000
      StrategyArbiter: 5000

      # Strategy
      BiasAuditor: 4000
      CurriculumPlannerPlus: 6000
      ThesisEvolutionEngine: 8000   # de-duplicated; keep higher
      TradingModeManager: 5000
      VisualizationInterface: 8000

      # Meta / analysis
      MetaAgent: 5000
      EnhancedAnomalyDetector: 8000
      EnhancedWorldModel: 15000  # Increased - training can take 3-16s

      # Reward - reduced for faster training (was 30000)
      RiskAdjustedReward: 8000

    # Coarse defaults by category (used when module not listed above)
    by_category:
      voting: 5000
      strategy: 4000
      meta: 4000

  stage:
    timeout_overhead_s: 3.0       # Reduced from 15s - adds to every stage
    timeout_pct_padding: 0.25     # Reduced from 0.75 - adds 25% instead of 75%
    pre_stage_readiness_preview: true
    soft_schedule_on_missing_inputs: true
    heartbeat_interval_s: 30.0    # Reduced frequency to avoid log spam
    report_to_bus: true

  # Circuit breaker behavior for critical modules
  circuit_breaker:
    auto_reset_critical_modules: true
    critical_module_recovery_time_s: 30.0

  # Auto-tuning settings
  adaptive:
    auto_tune_timeouts: true
    timeout_target_pctl: 0.95
    timeout_floor_ms: 4500
    timeout_ceiling_ms: 30000   # raised to respect largest override
    readiness_grace_s: 3.0      # aligned with logs
    half_open_single_probe: true
    stale_warn_s: 300.0         # increased to 5min due to orchestrator slowdown (10s->33s per execution)
    dynamic_config_bus_key: "config_update"
    # AGGRESSIVE config wait times - critical for fast training
    config_wait_timeout_s: 1.0   # Reduced from 10s - config is cached after first check
    config_ready_grace_s: 0.1    # Minimal stabilization period
    startup_max_wait_s: 3.0      # Reduced from 45s - system_ready gate timeout

  # Circuit breaker thresholds by module criticality
  circuit_breaker_thresholds:
    critical_modules: 10         # Critical modules (Executor, MarketDataProvider) get 10 failures
    voting_modules: 5            # Voting members get 5 failures
    default: 3                   # Others get 3 failures

  # External Data Sources Configuration
  MarketDataProvider:
    config:
      data_directory: "data/processed"
      supported_symbols: ["XAU_USD", "EUR_USD"]
      supported_timeframes: ["M15", "H1", "H4", "D1"]
      primary_timeframe: "H4"
      update_frequency: 1.0  # Update every second for live tick-by-tick data
      buffer_size: 5000
      # Price change threshold for intra-bar updates (default: 0.0001)
      # Smaller = more sensitive to price changes, more frequent voting
      # Larger = less sensitive, less frequent voting (saves resources)
      # How many bars to pull from MT5 (both initial and refresh)
      # 3000 M15 bars = 30+ days of history
      # Maintains full rolling history for accurate MTF regime detection (M15/H1/H4/D1)
      # Without this, multi-timeframe patterns appear "frozen" after first refresh
      live_bars_to_fetch: 3000
      # Historical window configuration
      # NOTE: window_min/max are legacy - actual window is now dynamically 1000 bars per timeframe
      # Each timeframe gets 1000 bars for accurate MTF regime detection:
      # M15: 1000 bars = 4.3 days | H1: 1000 bars = 41 days | H4: 1000 bars = 166 days | D1: 1000 bars = 2.7 years
      window_min: 60          # Minimum historical bars to provide (experts need 55-65 bars)
      window_max: 1000        # Maximum historical bars per timeframe (1000 for distinct MTF patterns)
      enable_technical_indicators: true
      timeout_ms: 5000  # Generous timeout for data loading and processing

# ═══════════════════════════════════════════════════════════════════════════════
# DECISION MODE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# Controls who makes the primary trading decision: PPO agent vs Voting Committee
#
# Mode 0 - SHADOW:    Committee trades, PPO runs in parallel but cannot affect trades.
#                     Used for validating PPO offline before trusting it.
#
# Mode 1 - COMMITTEE: Committee is primary decision maker, PPO can veto/advise.
#                     Use when PPO is untrusted or in early training.
#
# Mode 2 - BLENDED:   Decision is a weighted blend of PPO and Committee.
#                     If PPO confidence is high → closer to PPO decision.
#                     If PPO confidence is low → closer to Committee decision.
#                     Good for transition phase.
#
# Mode 3 - PPO:       PPO is the primary decision maker.
#                     Committee outputs are features in PPO observation + safety hints.
#                     Risk/compliance modules always sit after and can veto.
#                     Use when PPO model is well-tested and trusted.
#
decision_mode:
  # Global default mode (can be overridden per-instrument below)
  # Options: "shadow", "committee", "blended", "ppo"
  mode: "ppo"
  
  # Per-instrument overrides (optional)
  # per_instrument:
  #   XAU_USD: "ppo"       # Trust PPO for gold
  #   EUR_USD: "blended"   # Still blending for forex
  
  # Blended mode configuration
  blended:
    # How to weight PPO vs Committee when both have signals
    # "confidence_weighted": higher confidence source gets more weight
    # "fixed": use fixed weights below
    strategy: "confidence_weighted"
    
    # Fixed weights (only used if strategy="fixed")
    ppo_weight: 0.6
    committee_weight: 0.4
    
    # Minimum confidence thresholds
    # NOTE: Keep low - PositionManager should NOT block expert decisions.
    # Experts and PPO already apply their own confidence logic.
    ppo_min_confidence: 0.30      # Low threshold - trust PPO's decision
    committee_min_confidence: 0.30 # Low threshold - trust committee's decision
    
    # Conflict resolution: what to do when PPO and Committee disagree
    # "higher_confidence": go with whoever is more confident
    # "abstain": don't trade if they disagree
    # "ppo_priority": PPO wins ties
    # "committee_priority": Committee wins ties
    conflict_resolution: "higher_confidence"
  
  # Safety overrides (apply in all modes except shadow)
  safety:
    # Committee can force abstain if unanimous and PPO confidence is low
    committee_unanimous_veto: true
    committee_unanimous_threshold: 0.8  # 80%+ of experts agree in opposite direction
    ppo_low_confidence_threshold: 0.4   # PPO confidence below this triggers check
    
    # Always log what PPO would have done (useful for Mode 0-1)
    log_ppo_shadow_decisions: true

# Optional preflight policy (keeps your current warning non-blocking)
preflight:
  required_bus_keys:
    - config_update
  optional_bus_keys:
    - system_health

monitoring:
  publish_interval_s: 60          # used by ConfigurationManager.get_monitoring_config()
  health_check_interval: 30
  log_level: WARNING
  metrics_interval: 60
  memory_warning_threshold: 80
  memory_cleanup_threshold: 85
  gc_frequency: 30

system:
  environment: production
  name: Trading Agent System
  version: 1.0.0
  max_memory_usage_mb: 12000
  enable_memory_cleanup: true
  log_rotation_size_mb: 100

modules:
  AdvancedFeatureEngine:
    config:
      feature_sets: ['technical', 'statistical', 'momentum', 'volatility']
      normalization: 'z_score'
      feature_selection: true
      timeout_ms: 100

  FractalRegimeConfirmation:
    config:
      fractal_levels: [5, 13, 34]
      confirmation_threshold: 0.75
      lookback_periods: 100
      timeout_ms: 200

  RegimePerformanceMatrix:
    config:
      regime_types: ['trending', 'ranging', 'volatile']
      performance_window: 200
      update_frequency: 20
      confidence_threshold: 0.8
      timeout_ms: 300

  TimeAwareRiskScaling:
    config:
      time_zones: ['asian', 'london', 'newyork']
      volatility_scaling: true
      session_risk_factors: [0.8, 1.2, 1.0]
      overlap_boost: 1.1
      timeout_ms: 150

  # Risk Management
  RiskManager:
    config:
      risk_assessment_frequency: 60
      alert_notification: true
      automated_responses: true
      risk_reporting: true
      timeout_ms: 50

  DynamicRiskController:
    config:
      base_risk_scale: 1.0
      min_risk_scale: 0.1
      max_risk_scale: 1.5
      vol_history_len: 30
      dd_threshold: 0.15
      vol_ratio_threshold: 2.0
      recovery_speed: 0.15
      risk_decay: 0.95
      adaptive_scaling: true
      regime_sensitivity: 1.0
      max_processing_time_ms: 100
      timeout_ms: 3000

  EnhancedAnomalyDetector:
    config:
      anomaly_threshold: 0.7
      lookback_window: 50
      sensitivity: 0.8
      detection_methods: ['statistical', 'ml_based', 'pattern']
      alert_cooldown: 300
      timeout_ms: 4000

  PortfolioRiskSystem:
    config:
      max_portfolio_var: 0.025
      position_limit_pct: 0.15
      correlation_threshold: 0.8
      var_confidence: 0.95
      rebalance_threshold: 0.05
      timeout_ms: 1000

  ExecutionQualityMonitor:
    config:
      slippage_threshold: 0.001
      latency_threshold_ms: 50
      quality_score_threshold: 0.8
      monitoring_window: 100
      alert_threshold: 0.7
      timeout_ms: 100

  ActiveTradeMonitor:
    config:
      max_trade_duration: 3600
      position_check_interval: 60
      risk_alert_threshold: 0.8
      duration_alert_hours: 24
      timeout_ms: 100

  ComplianceModule:
    config:
      max_leverage: 10.0
      position_limits:
        individual: 0.1
        sector: 0.3
      compliance_checks: ['leverage', 'position_size', 'regulatory']
      alert_threshold: 0.9
      timeout_ms: 150

  DrawdownRescue:
    config:
      rescue_threshold: 0.10
      max_drawdown_limit: 0.20
      recovery_target: 0.05
      rescue_mode_duration: 3600
      timeout_ms: 200

  CorrelatedRiskController:
    config:
      correlation_threshold: 0.7
      lookback_period: 60
      diversification_target: 0.3
      cluster_threshold: 0.8
      timeout_ms: 200

  # Voting
  StrategyArbiter:
    config:
      action_dim: 4
      adapt_rate: 0.01
      min_confidence: 0.3
      bootstrap_steps: 50
      debug: false
      reinforce_lr: 0.001
      prior_blend: 0.30
      timeout_ms: 3000

  AlternativeRealitySampler:
    config:
      num_samples: 1000
      confidence_threshold: 0.6
      diversity_weight: 0.3
      sample_horizon: 20
      bootstrap_ratio: 0.8
      timeout_ms: 6000

  CollusionAuditor:
    config:
      detection_threshold: 0.8
      correlation_window: 30
      independence_threshold: 0.5
      audit_frequency: 10
      suspicious_threshold: 0.7
      timeout_ms: 6000

  ConsensusDetector:
    config:
      consensus_threshold: 0.7
      quality_threshold: 0.6
      member_weight_decay: 0.95
      confidence_weight: 0.4
      timeout_ms: 1000

  TimeHorizonAligner:
    config:
      alignment_threshold: 0.8
      horizon_weights: [1.0, 0.8, 0.6, 0.4]
      adaptation_rate: 0.05
      regime_sensitivity: 1.2
      timeout_ms: 6000

  VotingKernel:
    config:
      voting_method: 'weighted_average'
      min_votes: 3
      confidence_weighting: true
      consensus_threshold: 0.6
      timeout_ms: 2000
      provides_data:
        - fragility
        - committee_members
        - signals
        - proposal_vectors

  # Updated name: CommitteeCoordinator (was EnhancedVotingCommitteeCoordinator)
  CommitteeCoordinator:
    config:
      consensus_threshold: 0.6
      minimum_voters: 2
      performance_weighting: true
      max_vote_age_s: 30.0
      discovery_mode: 'registry_only'
      voter_flag_name: 'is_voting_member'
      # Explicit voters list (empty = use discovery from contracts)
      voters: []
      timeout_ms: 5000

  # Legacy name - kept for backward compatibility
  EnhancedVotingCommitteeCoordinator:
    config:
      committee_size: 5
      rotation_frequency: 50
      performance_weight: 0.6
      diversity_weight: 0.4
      timeout_ms: 3000

  # Strategy
  BiasAuditor:
    config:
      bias_detection_threshold: 0.7
      correction_strength: 0.5
      audit_window: 100
      bias_types: ['confirmation', 'anchoring', 'overconfidence']
      timeout_ms: 2000

  CurriculumPlannerPlus:
    config:
      learning_stages: ['basic', 'intermediate', 'advanced']
      mastery_threshold: 0.8
      progression_rate: 0.05
      stage_duration: 1000
      timeout_ms: 5000

  ExplanationGenerator:
    config:
      explanation_depth: 'detailed'
      narrative_style: 'technical'
      update_frequency: 60
      context_window: 50
      timeout_ms: 2000

  StrategyIntrospector:
    config:
      introspection_depth: 3
      pattern_window: 50
      adaptation_threshold: 0.6
      analysis_frequency: 25
      timeout_ms: 300

  ThesisEvolutionEngine:
    config:
      population_size: 20
      mutation_rate: 0.1
      crossover_rate: 0.7
      evolution_generations: 50
      fitness_threshold: 0.8
      timeout_ms: 500

  # Meta
  MetaAgent:
    config:
      window: 20
      profit_target: 150.0
      retrain_threshold: -50.0
      emergency_threshold: -100.0
      confidence_threshold: 0.7
      min_training_episodes: 100
      max_processing_time_ms: 300
      timeout_ms: 3000

  # DEPRECATED - Moved to modules/meta/legacy/, code commented out
  # MetaRLController:
  #   config:
  #     learning_rate: 0.001
  #     batch_size: 64
  #     replay_buffer_size: 10000
  #     target_update_frequency: 100
  #     exploration_rate: 0.1
  #     timeout_ms: 500

  # PPO Agent v3.0 (3-layer architecture)
  PPOAgent:
    config:
      # Core PPO settings
      learning_rate: 0.0003
      clip_eps: 0.2
      value_coeff: 0.5
      entropy_coeff: 0.01
      gae_lambda: 0.95
      gamma: 0.99
      max_grad_norm: 0.5
      ppo_epochs: 4
      batch_size: 64
      # Network architecture
      obs_size: 48
      act_size: 2
      hidden_size: 128
      # Performance settings
      timeout_ms: 500
      max_processing_time_ms: 500
      circuit_breaker_threshold: 3
      # Debug
      debug: false

  # Memory
  UnifiedMemory:
    config:
      # Legacy settings
      memory_capacity: 100000
      compression_ratio: 0.1
      retrieval_threshold: 0.7
      pattern_recognition_depth: 5
      forgetting_rate: 0.001
      timeout_ms: 2000

      # Debug settings (DISABLED for training performance)
      debug: false
      debug_level: "WARNING"
      debug_log_path: "logs/memory/unified_debug.log"
      enable_combined_log: false
      enable_trace_log: false
      trace_file_path: "logs/memory/unified_trace.log"
      enable_debug_log: false
      debug_file_path: "logs/memory/unified_debug_only.log"
      enable_info_log: false
      info_file_path: "logs/memory/unified_info.log"
      enable_warning_log: false
      warning_file_path: "logs/memory/unified_warning.log"
      enable_error_log: true
      error_file_path: "logs/memory/unified_error.log"

      # Core settings (optimized)
      max_memory_size: 5000
      batch_size: 16
      parallel_processing: true
      cache_size: 5000

      # Component flags
      enable_replay: true
      enable_compression: false
      enable_mistakes: true
      enable_neural: false
      enable_playbook: true
      enable_budget: false
      enable_loss_risk_head: true
      enable_interventions: true

      # Performance
      max_processing_time_ms: 200
      circuit_breaker_threshold: 3
      health_check_interval: 60

      # Replay
      replay_interval: 10
      replay_decay: 0.9
      sequence_len: 5
      replay_profit_threshold: 10.0

      # Compression
      n_components: 8
      compress_interval: 10

      # Mistakes
      n_clusters: 5
      danger_threshold: 0.7
      avoidance_sensitivity: 1.0
      mistake_profit_threshold: 10.0

      # Neural
      embed_dim: 32
      num_heads: 4
      memory_decay: 0.95
      importance_threshold: 0.3

      # Playbook
      k_neighbors: 5
      similarity_threshold: 0.7
      pattern_memory_size: 50

      # Budget
      rebalance_interval: 50
      utilization_target: 0.8
      efficiency_weight: 0.7
      recency_weight: 0.3

  # External Data
  SessionManager:
    config:
      session_duration: 3600
      health_check_interval: 60
      emergency_mode_threshold: 0.9
      performance_tracking: false
      timeout_ms: 100

  MarketDataProvider:
    config:
      update_frequency: 1.0
      data_sources: ['primary', 'backup']
      cache_duration: 10
      quality_threshold: 0.95
      timeout_ms: 200
      instruments:
        EUR_USD:
          timeframes: ['M15', 'H1', 'H4', 'D1']
          enabled: true
          priority: "high"
        XAU_USD:
          timeframes: ['M15', 'H1', 'H4', 'D1']
          enabled: true
          priority: "high"
      provides_data:
        - market_data_EUR_USD_M15
        - market_data_EUR_USD_H1
        - market_data_EUR_USD_H4
        - market_data_EUR_USD_D1
        - market_data_XAU_USD_M15
        - market_data_XAU_USD_H1
        - market_data_XAU_USD_H4
        - market_data_XAU_USD_D1
        - volatility_data
        - universe
        - watched_instruments

  # Execution
  Executor:
    config:
      execution_timeout: 5.0
      order_validation: true
      risk_checks: true
      slippage_tolerance: 0.001
      timeout_ms: 5000  # Increased from 1000ms to prevent circuit breaker trips during data processing

  # Trading Modes
  TradingModeManager:
    config:
      available_modes: ['conservative', 'balanced', 'aggressive']
      mode_switch_threshold: 0.8
      evaluation_window: 100
      default_mode: 'balanced'
      timeout_ms: 200

  # Reward
  RiskAdjustedReward:
    config:
      risk_penalty_weight: 0.3
      return_weight: 0.7
      sharpe_target: 1.5
      max_drawdown_penalty: 2.0
      timeout_ms: 30000
      max_processing_time_ms: 30000

  # Features
  MultiScaleFeatureEngine:
    config:
      scales: [1, 5, 15, 60]
      feature_dimensions: 50
      neural_layers: [128, 64, 32]
      dropout_rate: 0.2
      timeout_ms: 300

  # News (optional)
  NewsSentimentModule:
    config:
      sentiment_threshold: 0.6
      news_sources: ['reuters', 'bloomberg', 'cnbc']
      update_frequency: 300
      language_models: ['sentiment_basic']
      timeout_ms: 500

  # Unified Market
  UnifiedMarketModule:
    config:
      analysis_depth: 'comprehensive'
      regime_detection: true
      liquidity_analysis: true
      theme_detection: true
      fractal_analysis: true

  EnhancedWorldModel:
    config:
      model_complexity: 'medium'
      prediction_horizon: 50
      state_dimensions: 128
      action_dimensions: 32
      learning_rate: 0.001
      update_frequency: 10
      timeout_ms: 800

  VisualizationInterface:
    config:
      chart_types: ['candlestick', 'line', 'volume']
      update_frequency: 1.0
      max_data_points: 1000
      real_time_updates: true
      export_formats: ['png', 'svg']
      timeout_ms: 200

  # Extra voting experts
  SeasonalityRiskExpert:
    config:
      # Trading window configuration (Bavaria/Germany timezone)
      trading_timezone: "Europe/Berlin"
      local_trade_start_hour: 9     # Start trading at 9:00 local time
      local_trade_end_hour: 18      # Stop new trades at 18:00 local time
      local_hard_close_hour: 22     # Hard close at 22:00 local time
      no_trade_last_minutes: 30
      # TEST MODE: Set to true to allow trades during off-hours (for testing only)
      allow_off_hours_trading: false

  # DEPRECATED - use SeasonalityRiskExpert instead
  EnhancedSeasonalityRiskExpert:
    config:
      seasonal_analysis_depth: 'comprehensive'
      historical_lookback_years: 5
      risk_seasonality_threshold: 0.6
      adaptive_weighting: true
      timeout_ms: 300
      provides_data:
        - expert_votes

  EnhancedThemeExpert:
    config:
      theme_detection_threshold: 0.7
      theme_categories: ['bullish', 'bearish', 'neutral', 'breakout']
      confidence_weighting: true
      adaptation_speed: 0.1
      timeout_ms: 250
      provides_data:
        - expert_votes

# InfoBus cross-process persistence (enables frontend to see training data)
info_bus:
  # Keep cross-process persistence enabled, but restrict it to
  # slow-moving UI/monitoring keys only. Voting / market-state
  # keys should be recomputed every session to avoid stale data.
  persistence_enabled: true
  persist_write_interval_seconds: 0.5
  persistence_file: "state/infobus_data.json"

  # Staleness checking - set to false for dashboard/monitoring mode where
  # orchestrator is not running a step loop. Set to true for training/live.
  staleness_check_enabled: false  # Default OFF - safe for dashboard viewing
  
  # live_mode controls staleness threshold when staleness_check_enabled=true:
  # - false: Training mode - staleness threshold extended to 2 hours  
  # - true: Live trading mode - strict staleness checking with max_data_age_seconds
  live_mode: false
  max_data_age_seconds: 30   # Used in LIVE mode when staleness_check_enabled=true

  # Keys to persist for frontend visibility. Only these keys will be
  # written to and loaded from the persistence file; all other keys
  # (including voting outputs) start fresh each session.
  persist_keys:
    - dashboard_data
    - visualization_data
    - performance_charts
    - trade_charts
    - chart_statistics
    - chart_history
    - visualization_reports
    - analytics_reports
    - system_status
    # Market data keys - needed for experts/PPO to access real-time data
    - market_data
    - historical_prices
    - provider_status
    - tick_prices
    - multi_timeframe_data
    - technical_indicators
    - universe
    - watched_instruments
    - timestamp
    - trading_session
    - session_type
