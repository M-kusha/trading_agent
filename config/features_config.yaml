category: features
description: Configuration for features modules
modules:
  AdvancedFeatureEngine:
    config_class: FeatureEngineConfig
    configuration:
      circuit_breaker_threshold:
        default: '5'
        description: Configuration parameter for circuit_breaker_threshold
        type: int
      enable_english_explanations:
        default: 'True'
        description: Configuration parameter for enable_english_explanations
        type: bool
      enable_error_pinpointing:
        default: 'True'
        description: Configuration parameter for enable_error_pinpointing
        type: bool
      enable_health_monitoring:
        default: 'True'
        description: Configuration parameter for enable_health_monitoring
        type: bool
      enable_neural_processing:
        default: 'True'
        description: Configuration parameter for enable_neural_processing
        type: bool
      enable_performance_tracking:
        default: 'True'
        description: Configuration parameter for enable_performance_tracking
        type: bool
      max_buffer_size:
        default: '1000'
        description: Configuration parameter for max_buffer_size
        type: int
      window_sizes:
        default: None
        description: Configuration parameter for window_sizes
        type: Optional[List[int]]
    description: Configuration for AdvancedFeatureEngine module
  MultiScaleFeatureEngine:
    config_class: MultiScaleConfig
    configuration:
      dropout_rate:
        default: '0.1'
        description: Configuration parameter for dropout_rate
        type: float
      embed_dim:
        default: '64'
        description: Configuration parameter for embed_dim
        type: int
      enable_gpu:
        default: 'True'
        description: Configuration parameter for enable_gpu
        type: bool
      feature_fusion_method:
        default: '''attention'''
        description: Configuration parameter for feature_fusion_method
        type: str
      neural_layers:
        default: '3'
        description: Configuration parameter for neural_layers
        type: int
      num_attention_heads:
        default: '4'
        description: Configuration parameter for num_attention_heads
        type: int
      timeframes:
        default: None
        description: Configuration parameter for timeframes
        type: Optional[List[str]]
    description: Configuration for MultiScaleFeatureEngine module
