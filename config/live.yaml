logging:
  debug: false
  level: INFO
  log_dir: logs/live_trading

paths:
  logs: logs/live_trading

environment:
  instruments: ["XAUUSD"]
  timeframes: ["M15", "H1", "H4", "D1"]
  num_envs: 1
  data_source: "live"
  max_steps: 50
  enable_shadow_sim: false

mode:
  name: "live"
  training: false
  live: true
  enable_shadow_sim: false

rl:
  final_training_steps: 0
  log_interval: 1
  checkpoint_freq: 0
  eval_freq: 0

# ── MT5 connection ───────────────────────────────────────────────────────────
# Credentials are NOT stored here. Two account/password pairs were previously
# committed in plaintext (one active, one commented out); both are in git
# history and must be rotated at the broker.
#
# Supply them through the environment instead - config/loader.py already reads
# these and they override anything in YAML:
#
#   setx MT5_ACCOUNT  <login>
#   setx MT5_PASSWORD <password>
#   setx MT5_SERVER   <server>
#
# `path` is safe to keep in version control: it is a local install location,
# not a secret. It previously pointed at "C:\Program Files\MetaTrader 5",
# which does not exist on this machine - the installed terminal is the FTMO
# build below. The tracked feature CSVs were verified to come from this exact
# terminal (400/400 bars matched bit-for-bit on OHLC and spread).
mt5:
  account: null
  password: null
  server: "FTMO-Demo"
  path: "C:\\Program Files\\FTMO MetaTrader 5\\terminal64.exe"

risk_overrides:
  emergency_drawdown_trigger: 0.09
