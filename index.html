<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FlowDashboard — Live Data Flow & Health</title>
  <link rel="stylesheet" href="dashboard.css" />
  <!-- Libraries (CDN): Cytoscape for graph, Chart.js for sparklines -->
  <script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">FlowDashboard</div>
    <div class="summary">
      <span id="count-green" class="pill pill-green">0</span>
      <span id="count-yellow" class="pill pill-yellow">0</span>
      <span id="count-red" class="pill pill-red">0</span>
      <span id="modules-total" class="muted">0 modules</span>
      <span id="edges-total" class="muted">0 edges</span>
      <span id="last-updated" class="muted">–</span>
    </div>
    <div class="controls">
      <input id="search" placeholder="Search module…" />
      <label class="chk"><input id="toggle-refresh" type="checkbox" checked /> Auto-refresh</label>
      <label class="chk"><input id="toggle-hide-green" type="checkbox" /> Hide green</label>
      <label class="chk"><input id="toggle-dark" type="checkbox" /> Dark</label>
      <select id="refresh-interval">
        <option value="2000">2s</option>
        <option value="3000" selected>3s</option>
        <option value="5000">5s</option>
        <option value="10000">10s</option>
      </select>
      <button id="btn-export">Export PNG</button>
      <a id="link-log" class="muted" href="logs/flow_dashboard/flow_dashboard.log" target="_blank">log</a>
    </div>
  </header>

  <main class="layout">
    <section class="panel graph-panel">
      <div id="graph"></div>
      <div class="legend">
        <span class="dot green"></span> OK
        <span class="dot yellow"></span> Degraded
        <span class="dot red"></span> Issue
      </div>
      <div id="graph-status" class="muted mono"></div>
    </section>

    <aside class="panel details-panel">
      <div id="module-none" class="placeholder">
        <div class="big">👋</div>
        <div>Select a node to see details</div>
      </div>

      <div id="module-details" class="hidden">
        <div class="mod-head">
          <div class="title">
            <span id="mod-status-dot" class="dot"></span>
            <h2 id="mod-title">Module</h2>
          </div>
          <div class="head-actions">
            <button id="btn-copy-name" title="Copy name">Copy</button>
          </div>
        </div>

        <div class="grid-cards">
          <div class="card">
            <div class="card-title">Health</div>
            <div class="healthbar"><div id="healthbar-fill"></div></div>
            <div class="kv"><span>Status</span><code id="mod-status">–</code></div>
            <div class="kv"><span>Breaker</span><code id="mod-breaker">–</code></div>
            <div class="kv"><span>Reason</span><code id="mod-reason">–</code></div>
          </div>

          <div class="card">
            <div class="card-title">Latency (ms)</div>
            <div class="kv"><span>p95</span><code id="mod-lat-p95">–</code></div>
            <div class="kv"><span>avg</span><code id="mod-lat-avg">–</code></div>
            <div class="kv"><span>execs</span><code id="mod-execs">–</code></div>
            <canvas id="chart-latency" height="60"></canvas>
          </div>

          <div class="card">
            <div class="card-title">Throughput (RPS)</div>
            <div class="kv"><span>reads</span><code id="mod-rps-r">–</code></div>
            <div class="kv"><span>writes</span><code id="mod-rps-w">–</code></div>
            <canvas id="chart-rps" height="60"></canvas>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Keys</div>
          <div class="kv wide">
            <span>Provides</span>
            <div id="mod-provides" class="chips"></div>
          </div>
          <div class="kv wide">
            <span>Consumes</span>
            <div id="mod-consumes" class="chips"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Module Theses</div>
          <div id="mod-theses" class="theses"></div>
        </div>
      </div>
    </aside>

    <section class="panel alerts-panel">
      <div class="panel-title">Alerts</div>
      <div id="alerts" class="table"></div>
    </section>

    <section class="panel events-panel">
      <div class="panel-title">Events Tail</div>
      <div id="events" class="table mono"></div>
    </section>

    <section class="panel top-lat-panel">
      <div class="panel-title">Top Latency (p95)</div>
      <div id="top-lat" class="table"></div>
    </section>
  </main>

  <footer class="foot">
    <span>Data source: <code id="data-src"></code></span>
    <span>Window: <code id="window-seconds">–</code>s</span>
    <span>v1</span>
  </footer>

  <script src="dashboard.js"></script>
</body>
</html>
